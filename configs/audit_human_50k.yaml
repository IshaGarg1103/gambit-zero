  '2026-02': {split: train, accepted_games: 5000}
  '2026-03': {split: train, accepted_games: 5000}
  '2026-04': {split: train, accepted_games: 5000}
  '2026-05': {split: train, accepted_games: 5000}
  '2026-06': {split: train, accepted_games: 5000}
  '2026-07': {split: train, accepted_games: 5000}
  '2026-08': {split: validation, accepted_games: 7500}
  '2026-09': {split: test, accepted_games: 7500}
filters:
